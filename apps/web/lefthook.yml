# lefthook.yml - Git hooks configuration
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --verbose --config ../../.gitleaks.toml
      # Scans staged files for secrets before commit

    secrets:
      run: pnpm --workspace-root secrets:check
      # Repo-specific scanner for Neon/Postgres URLs and service tokens

    validate-env:
      run: bash scripts/validate-env-vars.sh
      # Ensure DATABASE_URL is used, not deprecated POSTGRES_URL

    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm eslint {staged_files} --max-warnings=0

    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm type-check

pre-push:
  commands:
    secrets:
      run: pnpm --workspace-root secrets:check
    gitleaks:
      run: gitleaks dir --redact=100 --config ../../.gitleaks.toml ../..
    typecheck:
      run: pnpm type-check
      # Fast ~5s check, CI handles full test suite
