# lefthook.yml - Monorepo Git hooks configuration
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --verbose --config .gitleaks.toml
      # Scans staged files for secrets before commit

    secrets:
      run: pnpm secrets:check
      # Repo-specific scanner for Neon/Postgres URLs and service tokens

    lint-web:
      glob: "apps/web/**/*.{js,ts,jsx,tsx}"
      run: pnpm --filter web lint

    lint-extension:
      glob: "apps/extension/**/*.{js,ts,jsx,tsx}"
      run: pnpm --filter extension lint

    typecheck:
      run: pnpm turbo run type-check

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    secrets:
      run: pnpm secrets:check
    gitleaks:
      run: gitleaks dir --redact=100 --config .gitleaks.toml .
    typecheck:
      run: pnpm turbo run type-check
    # Note: Tests require postgres database - run via CI or manually
    # test:
    #   run: pnpm turbo run test
