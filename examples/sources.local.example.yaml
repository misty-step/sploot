# Copy this shape to .gradient/sources.local.yaml for a personal deployment.
# Keep real paths, collection names, credentials, and generated private bundles
# out of the public Gradient repo.

sources:
  - id: personal-vault
    kind: qmd
    mode: read-only
    collection: personal-vault-local
    permissions: private/operator
    retrieval:
      command: qmd query
      max_results: 5
      full_content: explicit-operator-step-only
    output:
      permission_label: private/personal-vault
      citations: required
      freshness: required
