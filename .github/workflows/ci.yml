name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sploot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter web db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sploot_test?sslmode=disable

      - name: Lint
        run: pnpm turbo run lint

      - name: Type check
        run: pnpm turbo run type-check

      # Note: Full production build requires real Clerk keys (handled by Vercel)
      # CI focuses on type-check, lint, and tests - the critical quality gates

      - name: Test (web)
        run: pnpm --filter web test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sploot_test?sslmode=disable

  extension-build:
    name: Extension Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm --filter extension build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: apps/extension/.output/
          retention-days: 7

  merge-gate:
    name: merge-gate
    if: always()
    needs: [build, extension-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.extension-build.result }}" != "success" ]]; then
            echo "Required jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
