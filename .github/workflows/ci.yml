name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:check
      - run: pnpm secrets:test
      - name: Scan commits in this event
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          pnpm secrets:check -- --git-range "$range"
      - name: Advisory PR size signals
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          {
            base="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base" || true
            range="$base...HEAD"
            echo "### Advisory PR size"
            git diff --shortstat "$range" || true
            read -r added removed <<<"$(git diff --numstat "$range" | awk '{if ($1+0==$1) a+=$1; if ($2+0==$2) d+=$2} END {print a+0, d+0}')" || true
            echo "Lines added: ${added:-0}  removed: ${removed:-0}"
            echo "#### New files"
            git diff --diff-filter=A --name-only "$range" || true
            echo "#### New Go packages under apps/server"
            git diff --diff-filter=A --name-only "$range" | grep -E '^apps/server/.+\.go$' | sed 's|/[^/]*$||' | sort -u | while read -r d; do git cat-file -e "$base:$d" 2>/dev/null || echo "$d"; done || true
            echo "#### New exported Go funcs"
            git diff -U0 --no-color "$range" -- . | awk '/^\+\+\+ b\// {go=($0 ~ /\.go$/)} go && /^\+func (\([^)]*\) )?[A-Z]/ {print}' || true
            echo "#### Test files"
            git diff --name-only "$range" | awk '/_test\.go$/{print "go-test",$0} /integration_test\.go$/{print "go-integration",$0} /\.test\.mjs$/{print "mjs-test",$0} /\.e2e\.test\.ts$/{print "ts-e2e",$0} /\.test\.ts$/{print "ts-test",$0}' || true
            added=${added:-0}; removed=${removed:-0}
            if (( added > 400 || (added > 100 && added > removed * 3) )); then echo "Consider a reduction pass: what can be deleted, reused or not built? (advisory)"; fi
            false || true
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit 0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/server/go.sum
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm stripe:sandbox:check
      - run: node --test scripts/check-stripe-sandbox.test.mjs
      - run: pnpm provider:check
      - run: pnpm provider:test
      - run: pnpm telemetry:check
      - run: pnpm telemetry:test
      - run: pnpm turbo run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/server/go.sum
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run type-check

  design:
    name: Design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Preserves the extension palette and current native/extension
      # anti-pattern guards without depending on the retired predecessor.
      - run: pnpm lint:design

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the surviving MCP package
        run: pnpm --filter @sploot/mcp build
      - name: Exercise MCP save and search contracts
        run: pnpm --filter @sploot/mcp test

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production manifest policy before release build
        run: pnpm --filter extension build:manifest-check && pnpm --filter extension manifest:check
      - name: Build production extension release artifacts
        run: pnpm --filter extension zip:prod
      - name: Scan compiled extension for retired provider residue
        run: pnpm telemetry:check -- --bundle-dir apps/extension/dist/chrome-mv3
      - name: Validate candidate release structure and provenance
        env:
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PROVENANCE_PATH: ${{ runner.temp }}/extension-release-provenance.json
        run: pnpm --filter extension release:structural
      - name: Assert strict release gate remains fail-closed without operator evidence
        env:
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PROVENANCE_PATH: ${{ runner.temp }}/extension-release-provenance.json
          RELEASE_REPORT_PATH: ${{ runner.temp }}/extension-release-report.json
        run: |
          set +e
          pnpm --filter extension release:check
          status=$?
          set -e
          test "$status" -eq 2
          node --input-type=module -e 'import fs from "node:fs"; const report=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (report.verdict !== "external-evidence-missing" || report.localBlockers.length !== 0 || report.externalBlockers.length !== 1 || !report.externalBlockers[0].startsWith("missing exact-provenance operator evidence:")) { console.error(report); process.exit(1); }' "$RELEASE_REPORT_PATH"
          echo 'strict release:check correctly failed closed with the exact external-evidence-missing verdict'
      - name: Test manifest policy
        run: pnpm --filter extension manifest:test
      - name: Test release provenance validators
        run: pnpm --filter extension release:test
      - name: Lint extension
        run: pnpm --filter extension lint
      - name: Test extension
        run: pnpm --filter extension test
      - name: Assert production artifact/provenance immediately before upload
        env:
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PROVENANCE_PATH: ${{ runner.temp }}/extension-release-provenance.json
        run: pnpm --filter extension exec node scripts/assert-release-artifact.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: |
            apps/extension/dist/
            ${{ runner.temp }}/extension-release-provenance.json
          retention-days: 7
      - name: Build real unpacked MV3 lifecycle harness
        run: pnpm --filter extension build:e2e
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/server/go.sum
      - name: Install SQLite development headers and media tools
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev ffmpeg
      - name: Prepare real local inference and service
        run: pnpm --filter server build && pnpm --filter server models:prepare
      - name: Install real Chromium for MV3 acceptance
        run: pnpm --filter extension exec playwright install chromium
      - name: Exercise real popup owner isolation in Chromium
        run: xvfb-run -a pnpm --filter extension test:layout
      - name: Exercise real update notice and current-version clearing in Chromium
        run: xvfb-run -a pnpm --filter extension test:update-nag
      - name: Install native browser accelerator driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool
      - name: Exercise real unpacked MV3 lifecycle in Chromium
        run: xvfb-run -a pnpm --filter server smoke --extension --binary build/sploot
      - name: Upload real MV3 browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extension-mv3-browser-diagnostics
          path: apps/extension/test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify-extension-dist:
    name: Verify uploaded extension artifact
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: extension-dist
          path: ${{ runner.temp }}/extension-dist
      - name: Recompute transported ZIP and provenance binding
        env:
          RELEASE_ARTIFACT_ROOT: ${{ runner.temp }}/extension-dist
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
        run: pnpm --filter extension release:verify-uploaded

  go-server:
    name: Go library integration
    runs-on: ubuntu-latest
    env:
      SPLOOT_DEPLOYMENT_ENV: test
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Install SQLite development headers and media tools
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev ffmpeg
      - name: Install browser for actual local application acceptance
        run: pnpm --filter server exec playwright install --with-deps chromium
      - name: Exercise real database, ownership, durable saves and indexing fences
        run: pnpm --filter server test:integration
      - name: Build service and recovery command from owned contracts
        run: pnpm --filter server build
      - name: Exercise isolated application boot, capture and search
        run: pnpm --filter server smoke --binary build/sploot
      - name: Build deployable self-contained Go image
        run: docker build --tag sploot-go-ci apps/server

  merge-gate:
    name: merge-gate
    if: always()
    needs: [secrets, lint, type-check, design, test, extension, verify-extension-dist, go-server]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          results=("${{ needs.secrets.result }}" "${{ needs.lint.result }}" "${{ needs.type-check.result }}" "${{ needs.design.result }}" "${{ needs.test.result }}" "${{ needs.extension.result }}" "${{ needs.verify-extension-dist.result }}" "${{ needs.go-server.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "One or more required jobs failed. Go integration: ${{ needs.go-server.result }}. See each required job above for its failure evidence."
              exit 1
            fi
          done
          echo "All jobs passed"

  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    env:
      HARNESS_SHA: "6286d1039976485a36a8a0d649c487cfee886939"
      BUN_URL: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64-baseline.zip
      BUN_SHA256: c678040f14fe0440eb839d37cbd0ce4c051a32da72806ac97de6a6aab6bf728f
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned foundation checker and Bun
        run: |
          root="$RUNNER_TEMP/foundation"
          mkdir -p "$root/checker" "$root/runtime"
          git init --quiet --initial-branch=checker "$root/checker"
          git -C "$root/checker" fetch --quiet --no-tags --depth=1 https://github.com/misty-step/harness.git "$HARNESS_SHA"
          git -C "$root/checker" checkout --quiet --detach "$HARNESS_SHA"
          test "$(git -C "$root/checker" rev-parse HEAD)" = "$HARNESS_SHA"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$root/runtime/bun.zip" "$BUN_URL"
          printf '%s  %s\n' "$BUN_SHA256" "$root/runtime/bun.zip" | sha256sum --check --strict
          unzip -q "$root/runtime/bun.zip" -d "$root/runtime"
      - name: Check repository foundations
        working-directory: ${{ runner.temp }}/foundation
        run: |
          bun="$RUNNER_TEMP/foundation/runtime/bun-linux-x64-baseline/bun"
          checker="$RUNNER_TEMP/foundation/checker/agent-config/bin/foundation-check.ts"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            "$bun" --no-env-file --no-install "$checker" check --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA"
          else
            "$bun" --no-env-file --no-install "$checker" check --repo "$GITHUB_WORKSPACE"
          fi

  story-walk:
    name: story-walk
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HARNESS_SHA: "6286d1039976485a36a8a0d649c487cfee886939"
      BUN_URL: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64-baseline.zip
      BUN_SHA256: c678040f14fe0440eb839d37cbd0ce4c051a32da72806ac97de6a6aab6bf728f
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/server/go.sum
      - name: Fetch pinned foundation checker and Bun
        run: |
          root="$RUNNER_TEMP/foundation"
          mkdir -p "$root/checker" "$root/runtime"
          git init --quiet --initial-branch=checker "$root/checker"
          git -C "$root/checker" fetch --quiet --no-tags --depth=1 https://github.com/misty-step/harness.git "$HARNESS_SHA"
          git -C "$root/checker" checkout --quiet --detach "$HARNESS_SHA"
          test "$(git -C "$root/checker" rev-parse HEAD)" = "$HARNESS_SHA"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$root/runtime/bun.zip" "$BUN_URL"
          printf '%s  %s\n' "$BUN_SHA256" "$root/runtime/bun.zip" | sha256sum --check --strict
          unzip -q "$root/runtime/bun.zip" -d "$root/runtime"
      - name: Walk affected stories and validate receipt
        shell: bash
        run: |
          set -euo pipefail
          bun="$RUNNER_TEMP/foundation/runtime/bun-linux-x64-baseline/bun"
          checker="$RUNNER_TEMP/foundation/checker/agent-config/bin/foundation-check.ts"
          foundation() { (cd "$RUNNER_TEMP/foundation" && "$bun" --no-env-file --no-install "$checker" "$@" --repo "$GITHUB_WORKSPACE"); }
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA=$(git rev-parse HEAD^); fi
          git cat-file -e "$BASE_SHA^{commit}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then foundation check --base "$BASE_SHA"; else foundation check; fi
          affected=$(foundation affected --base "$BASE_SHA")
          if [[ -n "$affected" ]]; then bash .exe/setup.sh; fi
          WALK_BASE="$BASE_SHA" qa/walk --stories "$affected"
          foundation receipt target/walk/walk-receipt.json --base "$BASE_SHA"
      - name: Upload story-walk receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sploot-story-walk-${{ github.sha }}
          path: target/walk/
          if-no-files-found: warn
          retention-days: 14
