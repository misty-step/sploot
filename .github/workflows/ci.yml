name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs to save CI, but never cancel an in-flight master
  # run — the migrate-prod job below must not be killed mid-DDL by a newer push
  # (a non-transactional migration could be left half-applied). Concurrent
  # migrate-prod runs are still safe: prisma migrate deploy serializes on a
  # Postgres advisory lock.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:check
      - run: pnpm secrets:test
      - name: Scan commits in this event
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          pnpm secrets:check -- --git-range "$range"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm provider:check
      - run: pnpm provider:test
      - run: pnpm lint:asset-grid-dto
      - run: pnpm --filter web check:api-docs
      - run: pnpm turbo run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run type-check

  design:
    name: Design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Enforces DESIGN.md / design-contract.md (the aesthetic ratchet): fails
      # the diff on reintroduced banned patterns (e.g. violet-on-black
      # gradient, backdrop-blur on the auth door) rather than staying
      # advisory-only. See scripts/check-design-system.mjs.
      - run: pnpm lint:design

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sploot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/sploot_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run database migrations
        run: pnpm --filter web db:migrate
      - name: Run tests
        run: pnpm --filter web test
      # Retrieval-quality gate (apps/web/eval/README.md): deterministic
      # golden-set eval against the committed baseline. Quality metrics have a
      # zero noise floor (committed embeddings); latency gates against the
      # absolute budget in eval/baseline.json. Fails the job on any regression.
      - name: Retrieval eval (golden-set search quality)
        run: pnpm --filter web eval:search

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint extension
        run: pnpm --filter extension lint
      - name: Test extension
        run: pnpm --filter extension test
      - name: Build extension
        run: pnpm --filter extension build
      - uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: apps/extension/dist/
          retention-days: 7

  merge-gate:
    name: merge-gate
    if: always()
    needs: [secrets, lint, type-check, design, test, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          results=("${{ needs.secrets.result }}" "${{ needs.lint.result }}" "${{ needs.type-check.result }}" "${{ needs.design.result }}" "${{ needs.test.result }}" "${{ needs.extension.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "One or more jobs failed: secrets=${{ needs.secrets.result }} lint=${{ needs.lint.result }} type-check=${{ needs.type-check.result }} design=${{ needs.design.result }} test=${{ needs.test.result }} extension=${{ needs.extension.result }}"
              exit 1
            fi
          done
          echo "All jobs passed"

  # Apply pending Prisma migrations to production on merge to master, after the
  # merge gate passes. The prod URL is held as a repo secret, so a schema change
  # reaches prod with no human running a DDL command and no one handling the
  # connection string per-deploy. Inert-but-loud until the secret is set.
  # See apps/web/docs/adr/007-prod-migrations-via-github-actions.md.
  migrate-prod:
    name: Migrate Prod
    needs: [merge-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending migrations to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::warning title=Prod auto-migrate not activated::PRODUCTION_DATABASE_URL secret is unset; skipping prod migrations. Set the production Neon URL as the repository secret to activate hands-off schema deploys."
            exit 0
          fi
          pnpm --filter web exec node scripts/migrate-deploy.mjs
