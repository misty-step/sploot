name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:check
      - run: pnpm secrets:test
      - name: Scan commits in this event
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          pnpm secrets:check -- --git-range "$range"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm stripe:sandbox:check
      - run: node --test scripts/check-stripe-sandbox.test.mjs
      - run: pnpm provider:check
      - run: pnpm provider:test
      - run: pnpm deployment:check
      - run: pnpm deployment:test
      - run: pnpm turbo run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run type-check

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build without runtime database or provider secrets
        run: pnpm deployment:build

  design:
    name: Design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Enforces DESIGN.md / design-contract.md (the aesthetic ratchet): fails
      # the diff on reintroduced banned patterns (e.g. violet-on-black
      # gradient, backdrop-blur on the auth door) rather than staying
      # advisory-only. See scripts/check-design-system.mjs.
      - run: pnpm lint:design

  economics:
    name: Economic safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify versioned rates, margins, budgets, and report reproducibility
        run: pnpm test:economics

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sploot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/sploot_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision restricted migration role without storing credentials
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=test
          bootstrap_version="$(cat apps/web/prisma/stripe-ledger-bootstrap.version)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v bootstrap_version="$bootstrap_version" -f apps/web/prisma/stripe-ledger-bootstrap-pre.sql
          app_password="$(openssl rand -hex 32)"
          migrator_password="$(openssl rand -hex 32)"
          issuer_password="$(openssl rand -hex 32)"
          consumer_password="$(openssl rand -hex 32)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$app_password" -v migrator_password="$migrator_password" -v issuer_password="$issuer_password" -v consumer_password="$consumer_password" <<'SQL'
          ALTER ROLE sploot_stripe_app LOGIN PASSWORD :'app_password';
          ALTER ROLE sploot_stripe_schema_migrator LOGIN PASSWORD :'migrator_password';
          ALTER ROLE sploot_stripe_ledger_issuer LOGIN PASSWORD :'issuer_password';
          ALTER ROLE sploot_stripe_ledger_consumer LOGIN PASSWORD :'consumer_password';
          SQL
          {
            echo "DATABASE_URL=postgresql://sploot_stripe_app:${app_password}@localhost:5432/sploot_test?sslmode=disable"
            echo "STRIPE_LEDGER_MIGRATION_DATABASE_URL=postgresql://sploot_stripe_schema_migrator:${migrator_password}@localhost:5432/sploot_test?sslmode=disable"
            echo "STRIPE_LEDGER_ISSUER_DATABASE_URL=postgresql://sploot_stripe_ledger_issuer:${issuer_password}@localhost:5432/sploot_test?sslmode=disable"
            echo "STRIPE_LEDGER_CONSUMER_DATABASE_URL=postgresql://sploot_stripe_ledger_consumer:${consumer_password}@localhost:5432/sploot_test?sslmode=disable"
          } >> "$GITHUB_ENV"
      - name: Run database migrations
        run: PGOPTIONS='-c lock_timeout=5s -c statement_timeout=30s' DATABASE_URL="$STRIPE_LEDGER_MIGRATION_DATABASE_URL" pnpm --filter web db:migrate
      - name: Verify migration history immutability
        run: DATABASE_URL="$STRIPE_LEDGER_MIGRATION_DATABASE_URL" node scripts/check-migration-history.mjs
      - name: Install privileged ledger owners and grants
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sploot_test?sslmode=disable
        run: |
          export PGPASSWORD=test
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v bootstrap_version="$(cat apps/web/prisma/stripe-ledger-bootstrap.version)" -f apps/web/prisma/stripe-ledger-bootstrap-post.sql
      - name: Run tests
        env:
          STRIPE_LEDGER_ADMIN_DATABASE_URL: postgresql://test:test@localhost:5432/sploot_test?sslmode=disable
        run: pnpm --filter web test
      # Retrieval-quality gate (apps/web/eval/README.md): deterministic
      # golden-set eval against the committed baseline. Quality metrics have a
      # zero noise floor (committed embeddings); latency gates against the
      # absolute budget in eval/baseline.json. Fails the job on any regression.
      - name: Retrieval eval (golden-set search quality)
        run: pnpm --filter web eval:search

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production manifest policy before release build
        run: pnpm --filter extension build:manifest-check && pnpm --filter extension manifest:check
      - name: Build production extension release artifacts
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter extension zip:prod
      - name: Validate candidate release structure and provenance
        env:
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PROVENANCE_PATH: ${{ runner.temp }}/extension-release-provenance.json
        run: pnpm --filter extension release:structural
      - name: Assert strict release gate remains fail-closed without operator evidence
        env:
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PROVENANCE_PATH: ${{ runner.temp }}/extension-release-provenance.json
          RELEASE_REPORT_PATH: ${{ runner.temp }}/extension-release-report.json
        run: |
          set +e
          pnpm --filter extension release:check
          status=$?
          set -e
          test "$status" -eq 2
          node --input-type=module -e 'import fs from "node:fs"; const report=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (report.verdict !== "external-evidence-missing" || report.localBlockers.length !== 0 || report.externalBlockers.length !== 1 || !report.externalBlockers[0].startsWith("missing exact-provenance operator evidence:")) { console.error(report); process.exit(1); }' "$RELEASE_REPORT_PATH"
          echo 'strict release:check correctly failed closed with the exact external-evidence-missing verdict'
      - name: Test manifest policy
        run: pnpm --filter extension manifest:test
      - name: Test release provenance validators
        run: pnpm --filter extension release:test
      - name: Lint extension
        run: pnpm --filter extension lint
      - name: Test extension
        run: pnpm --filter extension test
      - name: Assert production artifact/provenance immediately before upload
        env:
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_PROVENANCE_PATH: ${{ runner.temp }}/extension-release-provenance.json
        run: pnpm --filter extension exec node scripts/assert-release-artifact.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: |
            apps/extension/dist/
            ${{ runner.temp }}/extension-release-provenance.json
          retention-days: 7
      - name: Build real unpacked MV3 lifecycle harness
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_lifecycle
          VITE_API_BASE_URL: http://127.0.0.1:3345
          VITE_CLERK_SYNC_HOST: http://127.0.0.1:3345
        run: pnpm --filter extension build:e2e
      - name: Install real Chromium for MV3 acceptance
        run: pnpm --filter extension exec playwright install chromium
      - name: Exercise real popup owner isolation in Chromium
        run: xvfb-run -a pnpm --filter extension test:layout
      - name: Install native browser accelerator driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool
      - name: Exercise real unpacked MV3 lifecycle in Chromium
        run: xvfb-run -a pnpm --filter extension test:mv3
      - name: Upload real MV3 browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extension-mv3-browser-diagnostics
          path: apps/extension/test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify-extension-dist:
    name: Verify uploaded extension artifact
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: extension-dist
          path: ${{ runner.temp }}/extension-dist
      - name: Recompute transported ZIP and provenance binding
        env:
          RELEASE_ARTIFACT_ROOT: ${{ runner.temp }}/extension-dist
          RELEASE_CANDIDATE_SHA: ${{ github.sha }}
        run: pnpm --filter extension release:verify-uploaded

  public-truth:
    name: Public truth browser
    runs-on: ubuntu-latest
    env:
      SPLOOT_DEPLOYMENT_ENV: test
      SPLOOT_ENROLLMENT_MODE: closed
      SPLOOT_QA_AUTH_MODE: disabled
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_${{ 'Y2xlcmsuZXhhbXBsZS5jb20k' }}
      CLERK_SECRET_KEY: ${{ format('sk_test_{0}', 'public-truth-ci-only') }}
      SPLOOT_PUBLIC_TRUTH_E2E_BUILD: 'true'
      PLAYWRIGHT_PORT: 3128
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build the production-shaped public-truth artifact
        run: pnpm --filter web e2e:public-truth:build
      - run: pnpm --filter web e2e:public-truth

  public-truth-production-guard:
    name: Public truth production omission guard
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      SPLOOT_DEPLOYMENT_ENV: production
      SPLOOT_PUBLIC_TRUTH_E2E_BUILD: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove production omission guard and compiled-bundle safety
        run: pnpm --filter web e2e:public-truth:production-guard

  db-authority:
    name: Restricted DB authority (pg${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16']
    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.pg }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sploot_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap and migrate as restricted production-shaped role
        shell: bash
        run: bash scripts/db-authority-rehearsal.sh "${{ matrix.pg }}"

          assert_hnsw_contract() {
            local database_url="$1"
            local iterative_scan_supported
            iterative_scan_supported="$(psql "$database_url" -Atc "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector' AND (split_part(extversion, '.', 1)::int > 0 OR (split_part(extversion, '.', 1)::int = 0 AND split_part(extversion, '.', 2)::int >= 8)))")"
            test "$iterative_scan_supported" = 't'
            local visibility_contract
            visibility_contract="$(psql "$database_url" -Atc "SELECT (SELECT attnotnull::text FROM pg_attribute WHERE attrelid = 'asset_embeddings'::regclass AND attname = 'owner_user_id') || '|' || (SELECT attnotnull::text FROM pg_attribute WHERE attrelid = 'asset_embeddings'::regclass AND attname = 'asset_deleted_at')")"
            test "$visibility_contract" = 't|f'
            local visibility_triggers
            visibility_triggers="$(psql "$database_url" -Atc "SELECT count(*) FROM pg_trigger WHERE tgrelid IN ('asset_embeddings'::regclass, 'assets'::regclass) AND tgname IN ('asset_embeddings_sync_visibility', 'assets_propagate_embedding_visibility') AND NOT tgisinternal")"
            test "$visibility_triggers" = '2'
            local visibility_remaining
            visibility_remaining="$(psql "$database_url" -Atc "SELECT \"sploot_asset_embedding_visibility_backfill_remaining\"()")"
            test "$visibility_remaining" = '0'
            local index_contract
            index_contract="$(psql "$database_url" -Atc "SELECT c.relname || '|' || t.relname || '|' || am.amname || '|' || a.attname || '|' || opc.opcname || '|' || COALESCE(string_agg(option_name, ',' ORDER BY option_name), '') FROM pg_class c JOIN pg_index i ON i.indexrelid = c.oid JOIN pg_class t ON t.oid = i.indrelid JOIN pg_am am ON am.oid = c.relam JOIN pg_attribute a ON a.attrelid = i.indrelid AND a.attnum = i.indkey[0] JOIN pg_opclass opc ON opc.oid = i.indclass[0] LEFT JOIN LATERAL unnest(COALESCE(c.reloptions, ARRAY[]::text[])) AS options(option_name) ON true WHERE c.relname = 'asset_embeddings_hnsw_idx' AND t.relname = 'asset_embeddings' GROUP BY c.oid, c.relname, t.relname, am.amname, a.attname, opc.opcname")"
            test "$index_contract" = 'asset_embeddings_hnsw_idx|asset_embeddings|hnsw|image_embedding|vector_cosine_ops|ef_construction=128,m=24'
            local index_definition_ok
            index_definition_ok="$(psql "$database_url" -Atc "SELECT (pg_get_indexdef(c.oid) ~ 'USING hnsw \\(image_embedding vector_cosine_ops\\) WITH \\(m=''?24''?, ?ef_construction=''?128''?\\)') FROM pg_class c WHERE c.relname = 'asset_embeddings_hnsw_idx'")"
            test "$index_definition_ok" = 't'
          }

          seed_and_explain_hnsw() {
            local database_url="$1"
            psql "$database_url" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, email, "createdAt", "updatedAt")
          VALUES
            ('index-plan-probe-user', 'index-plan-probe-user@example.test', NOW(), NOW()),
            ('index-plan-probe-foreign', 'index-plan-probe-foreign@example.test', NOW(), NOW());
          INSERT INTO assets (id, owner_user_id, blob_url, pathname, mime, size, checksum_sha256, "createdAt", "updatedAt")
          SELECT
            'index-plan-probe-' || n,
            'index-plan-probe-user',
            'https://index-plan-probe.public.blob.vercel-storage.com/' || n || '.png',
            n || '.png',
            'image/png',
            1,
            'index-plan-probe-checksum-' || n,
            NOW(),
            NOW()
          FROM generate_series(1, 1000) AS series(n)
          UNION ALL
          SELECT
            'index-plan-probe-foreign-' || n,
            'index-plan-probe-foreign',
            'https://index-plan-probe.public.blob.vercel-storage.com/foreign-' || n || '.png',
            'foreign-' || n || '.png',
            'image/png',
            1,
            'index-plan-probe-foreign-checksum-' || n,
            NOW(),
            NOW()
          FROM generate_series(1, 5000) AS series(n);
          INSERT INTO asset_embeddings (asset_id, model_name, model_version, dim, image_embedding, status, "createdAt", "updatedAt")
          SELECT
            'index-plan-probe-' || n,
            'index-plan-probe-model',
            'v1',
            768,
            ('[' || (0.1 + n / 100000.0)::text || ',' || repeat('0.1,', 766) || '0.1]')::vector(768),
            'ready',
            NOW(),
            NOW()
          FROM generate_series(1, 1000) AS series(n)
          UNION ALL
          SELECT
            'index-plan-probe-foreign-' || n,
            'index-plan-probe-model',
            'v1',
            768,
            ('[' || repeat('0.1,', 767) || '0.1]')::vector(768),
            'ready',
            NOW(),
            NOW()
          FROM generate_series(1, 5000) AS series(n);
          SQL
            psql "$database_url" -v ON_ERROR_STOP=1 -c 'ANALYZE assets; ANALYZE asset_embeddings'
            local query="WITH ranked AS MATERIALIZED (SELECT ae.asset_id AS id, ae.image_embedding <=> ('[' || repeat('0.1,', 767) || '0.1]')::vector(768) AS distance FROM asset_embeddings ae WHERE ae.owner_user_id = 'index-plan-probe-user' AND ae.asset_deleted_at IS NULL AND ae.status = 'ready' ORDER BY ae.image_embedding <=> ('[' || repeat('0.1,', 767) || '0.1]')::vector(768) ASC, ae.asset_id ASC LIMIT 20) SELECT a.id, 1 - ranked.distance AS similarity FROM ranked INNER JOIN assets a ON a.id = ranked.id WHERE a.owner_user_id = 'index-plan-probe-user' AND a.deleted_at IS NULL AND 1 - ranked.distance >= 0.5 ORDER BY ranked.distance ASC, a.id ASC LIMIT 20"
            local default_plan
            default_plan="$(psql "$database_url" -Atc "BEGIN; SET LOCAL hnsw.iterative_scan = strict_order; SET LOCAL hnsw.max_scan_tuples = 20000; EXPLAIN (COSTS OFF) $query; ROLLBACK;")"
            echo 'default planner plan (production-shaped ranked vector query):'
            echo "$default_plan"
            test -n "$default_plan"
            echo "$default_plan" | grep -F 'owner_user_id'
            echo "$default_plan" | grep -F 'asset_deleted_at'
            echo "$default_plan" | grep -F 'status = '\''ready'\'''
            echo "$default_plan" | grep -F 'Sort Key:'

            # The capability oracle is the same production-shaped SQL under
            # the default planner. The ranked CTE boundary makes raw vector
            # distance ordering + LIMIT visible to pgvector without disabling
            # competing scan families or faking an index-only query.
            local capability_plan
            capability_plan="$(psql "$database_url" -Atc "BEGIN; SET LOCAL hnsw.iterative_scan = strict_order; SET LOCAL hnsw.max_scan_tuples = 20000; EXPLAIN (COSTS OFF) $query; ROLLBACK;")"
            echo 'default-planner HNSW capability plan:'
            echo "$capability_plan"
            test "$capability_plan" = "$default_plan"
            echo "$capability_plan" | grep -F 'Index Scan using asset_embeddings_hnsw_idx'
            local result_rows
            result_rows="$(psql "$database_url" -Atc "BEGIN; SET LOCAL hnsw.iterative_scan = strict_order; SET LOCAL hnsw.max_scan_tuples = 20000; $query; ROLLBACK;" | sed -n '/^index-plan-probe-/p')"
            test "$(printf '%s\n' "$result_rows" | wc -l)" -eq 20
            if printf '%s\n' "$result_rows" | grep -q 'index-plan-probe-foreign'; then
              echo 'owner-scoped HNSW query leaked a foreign asset'
              return 1
            fi
          }

          assert_hnsw_contract "$admin_url"
          seed_and_explain_hnsw "$admin_url"

          fresh_url='postgresql://test:test@localhost:5432/sploot_fresh?sslmode=disable'
          psql 'postgresql://test:test@localhost:5432/postgres?sslmode=disable' -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sploot_fresh'
          DATABASE_URL="$fresh_url" pnpm --filter web db:migrate
          assert_hnsw_contract "$fresh_url"
          seed_and_explain_hnsw "$fresh_url"

  gallery-browser:
    name: Gallery browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sploot_gallery_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QA_GALLERY_DB_URL: postgresql://test:test@127.0.0.1:5432/sploot_gallery_qa?sslmode=disable
      SPLOOT_QA_AUTH_SECRET: ci-gallery-deterministic-secret-v1
      SPLOOT_QA_GALLERY_SEED: '296'
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run deterministic authenticated gallery matrix
        run: pnpm --filter web qa:gallery
      - name: Upload gallery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/.next/qa-provenance.json
          if-no-files-found: ignore
          retention-days: 7

  merge-gate:
    name: merge-gate
    if: always()
    needs: [secrets, lint, type-check, web-build, design, economics, test, extension, verify-extension-dist, public-truth, public-truth-production-guard, db-authority, gallery-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          results=("${{ needs.secrets.result }}" "${{ needs.lint.result }}" "${{ needs.type-check.result }}" "${{ needs.web-build.result }}" "${{ needs.design.result }}" "${{ needs.economics.result }}" "${{ needs.test.result }}" "${{ needs.extension.result }}" "${{ needs.verify-extension-dist.result }}" "${{ needs.public-truth.result }}" "${{ needs.public-truth-production-guard.result }}" "${{ needs.db-authority.result }}" "${{ needs.gallery-browser.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
