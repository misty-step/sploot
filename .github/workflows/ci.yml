# CI - Quality gates for PRs and main branch
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Type check
        run: bun tsc --noEmit

      - name: Test with coverage
        run: |
          bun test --coverage --reporter=text --reporter=json
          # Save coverage report for PR comments
          echo "COVERAGE_REPORT<<EOF" > $GITHUB_ENV
          cat coverage/coverage-summary.json
          echo "EOF" >> $GITHUB_ENV

      - name: Verify env documentation
        run: |
          # Check that all env vars used in code are documented in .env.example
          echo "Checking env var documentation..."
          UNDOCUMENTED=""
          for var in SENTRY_DSN POSTHOG_API_KEY; do
            if ! grep -q "^$var=" .env.example; then
              UNDOCUMENTED="$UNDOCUMENTED $var"
            fi
          done
          if [ -n "$UNDOCUMENTED" ]; then
            echo "❌ Undocumented env vars:$UNDOCUMENTED"
            echo "Add these to .env.example"
            exit 1
          fi
          echo "✅ All critical env vars documented"

      - name: Build
        run: bun run build

  # Cerberus AI Code Review
  review:
    needs: quality
    uses: misty-step/cerberus/.github/workflows/cerberus.yml@master
    permissions:
      contents: read
      pull-requests: write
    secrets:
      api-key: ${{ secrets.CERBERUS_OPENROUTER_API_KEY }}
    with:
      context: "AI agent with advanced tool-calling capabilities"
      fail-on-verdict: true
      fail-on-skip: true
