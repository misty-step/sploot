name: Test Coverage

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sploot_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm version is auto-detected from package.json packageManager field
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        id: test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sploot_test
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/sploot_test
          POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/sploot_test
        run: pnpm test:coverage
        continue-on-error: true

      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: steps.test.outcome == 'success'
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1
