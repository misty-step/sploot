# Foundation review gate (ADR-003 Review authority, US-027).
# pull_request_target runs this file from the base branch; PR commits are checked
# out only as data, never executed. A review needs a label change to re-run it.
name: foundation-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  foundation-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Require designated reviewer where a PR needs one
        # Execute only base-branch code. Candidate scripts/config are untrusted data.
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node "$GITHUB_WORKSPACE/trusted/qa/spec-check.mjs" \
            review --repo "$GITHUB_WORKSPACE/candidate" --pr "$PR_NUMBER"
