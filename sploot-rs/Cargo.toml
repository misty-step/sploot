[package]
name = "sploot-rs"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
js-sys = "0.3"
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }
worker = { version = "0.8.7", features = ["d1"] }
